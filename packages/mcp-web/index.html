<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-graph · viewer</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; background: #0d0f14; color: #e6e6eb; font: 13px ui-monospace, monospace; }
      #topbar { position: fixed; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: #14171f; border-bottom: 1px solid #232733; z-index: 10; }
      #title { font-weight: 600; }
      #conn.on { color: #52c41a; } #conn.off { color: #8a8f98; }
      #seq { color: #8a8f98; }
      #drift { color: #ff4d4f; font-weight: 600; }
      #rebuild { margin-left: auto; background: #232733; color: #e6e6eb; border: 1px solid #3a3f4b; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
      #rebuild:hover { background: #2c3140; }
      #cv { position: fixed; inset: 34px 0 0 0; width: 100%; height: calc(100% - 34px); display: block; }
      #events { position: fixed; top: 34px; right: 0; bottom: 0; width: 300px; background: rgba(20,23,31,0.92); border-left: 1px solid #232733; overflow-y: auto; padding: 8px; }
      #events h3 { font-size: 11px; text-transform: uppercase; color: #8a8f98; margin-bottom: 6px; }
      #evlist { list-style: none; }
      #evlist li { padding: 3px 4px; border-bottom: 1px solid #1c2029; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #evlist li:hover { background: #232733; }
      #panel { position: fixed; top: 44px; left: 12px; width: 320px; background: rgba(20,23,31,0.96); border: 1px solid #232733; border-radius: 6px; padding: 12px; z-index: 9; }
      #panel h3 { margin-bottom: 8px; word-break: break-all; }
      #panel #close { position: absolute; top: 6px; right: 8px; background: none; border: none; color: #8a8f98; font-size: 18px; cursor: pointer; }
      #panel dt { color: #8a8f98; font-size: 11px; margin-top: 6px; }
      #panel dd { word-break: break-word; }
    </style>
  </head>
  <body>
    <noscript>enable JavaScript</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
