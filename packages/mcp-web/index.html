<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-graph</title>
    <style>
      /* Base do norte visual (docs/prompts/ui-concept-generator.md): quase-preto,
         violeta primário, verde=publicado, âmbar=lock, vermelho=deny. Componentes
         estilizam o resto via src/app.css. */
      * { box-sizing: border-box; margin: 0; }
      :root {
        --bg: #0a0a0f; --panel: #121218; --border: #26262e;
        --text: #e6e6eb; --muted: #8a8f98;
        --accent: #8b5cf6; --ok: #10b981; --warn: #f59e0b; --err: #ef4444;
      }
      html, body, #root { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font: 13px Inter, system-ui, sans-serif; }
      code, .mono { font-family: ui-monospace, "JetBrains Mono", monospace; }
    </style>
  </head>
  <body>
    <noscript>enable JavaScript</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
