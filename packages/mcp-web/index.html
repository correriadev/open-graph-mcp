<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-graph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* Tokens do norte visual, portados de assets/prototype/prototype_canvas_v1.html
         (o proprio prototipo pede: "extract shared tokens/components only when porting
         the approved design to the app"). Nomes NOVOS = os do prototipo; os nomes
         antigos (--border/--accent/--ok/--warn/--err) viram ALIAS e continuam validos,
         porque src/app.css e ~400 linhas construidas sobre eles. Componentes estilizam
         o resto via src/app.css. */
      * { box-sizing: border-box; margin: 0; }
      :root {
        color-scheme: dark;
        --bg: #090a0b;
        --canvas: #0c0d0e;
        --panel: #121314;
        --panel-2: #171819;
        --line: #303235;
        --line-soft: #242629;
        --text: #e9e9e7;
        --muted: #94979b;
        --orange: #ff9800;
        --violet: #8b5cf6;
        --teal: #43b8ad;
        /* escada P1-P5: cinza → azul → teal → âmbar → vermelho */
        --p1: #a0a0a0; --p2: #64a8ee; --p3: #43b8ad; --p4: #f59e0b; --p5: #ef6461;
        --topbar-h: 61px;

        /* aliases legados (não remover sem varrer app.css) */
        --border: var(--line-soft);
        --accent: var(--violet);
        --ok: #41c7a0;
        --warn: var(--p4);
        --err: var(--p5);
      }
      html, body, #root { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
        font: 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      code, .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      button, input, select, textarea { font: inherit; }
      button:focus-visible, input:focus-visible { outline: 2px solid #d4d4d4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <noscript>enable JavaScript</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
