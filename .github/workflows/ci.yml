name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual, opt-in trigger for the advisory probe job. No schedule is chosen because trigger cadence
  # is an unresolved architecture question and CI must not settle it by convenience.
  workflow_dispatch:
    inputs:
      run_eap_probes:
        description: Run the advisory EAP concurrency, cancellation, and 100k scale probes
        required: true
        type: boolean
        default: false

jobs:
  test:
    # BLOCKING SIGNAL: on push/PR, any suite, quarantine, strict typecheck, or web build failure blocks.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Flake Ledger append-only reconciliation reads the branch-point revision.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # F002 task 02 — Unified verification entrypoint. This was a bare `bun test`, while root
      # package.json's `test` script ran `--cwd packages/mcp-server`: "tests pass" locally and
      # "tests pass" in CI were different claims. The gate now invokes the SAME script a developer
      # runs, so the two cannot drift apart again — `bun run test` is `bun test` at the repo root,
      # and `bun run verify` is that plus the task 01 typecheck gate. Do not "simplify" this back
      # to `bun test`: the indirection through the script IS the property being enforced.
      - run: bun run test
      # F002 task 08 — Quarantine Violation Gate. BLOCKING BY DECISION, not by accident: no
      # `continue-on-error`, no `if:` that could turn it advisory. A test case that discharges a
      # Scenario inside one of the seven Quarantined Ambiguity families QA1-QA7 settles an open
      # architectural question by fiat, and a green suite would record that decision nowhere.
      #
      # `!cancelled()` rather than the default: a RED suite must not be able to hide a quarantine
      # violation. The step still fails the job when it fails — `!cancelled()` changes when it runs,
      # never whether it blocks.
      #
      # Placed AFTER `bun run test` deliberately. The gate needs no run: it reads the committed
      # docs/verification/traceability-map.json and statically scans the declared EAP Test Corpus,
      # both of which a fresh clone has. Running it here additionally gives it the live
      # .verification/annotations.jsonl sink from the suite above, which is strictly stronger and
      # never weaker. It does NOT need the `--reporter=junit` flags task 07's map regeneration
      # needs, so no step above has to change.
      - name: Quarantine Violation Gate (blocking)
        if: ${{ !cancelled() }}
        run: bun scripts/verification/quarantine-gate.ts
      # F002 task 22 — Flake quarantine is owned, append-only credibility debt. This integrity
      # check is BLOCKING: malformed ownership, a closure without a cause, or an open record whose
      # test file disappeared fails the job. An open flake itself is reported debt, never permission
      # to skip or delete the test, and therefore does not turn a failing suite green.
      - name: Flake Ledger Integrity Gate (blocking)
        if: ${{ !cancelled() }}
        run: bun scripts/verification/flake-ledger.ts --check
      # Was `bunx tsc --noEmit` in packages/mcp-web, which resolved an unpinned TypeScript 7.0.2
      # from bunx's registry fallback (no `typescript` was declared at the repo root). F002 task 01
      # pinned typescript@5.8.2 at the root; this now runs THAT compiler. mcp-web has no frozen
      # error baseline because it is clean — any diagnostic here fails.
      - run: bun run typecheck:strict packages/mcp-web/tsconfig.json
      - run: bun run build
        working-directory: packages/mcp-web

  # F002 task 01 — Toolchain Pin + Frozen Error Set ratchet.
  # BLOCKING BY DECISION, not by accident: no `if:`, no `continue-on-error`. graph-core,
  # mcp-server and client carry 44 pre-existing type errors that decision D1 freezes rather than
  # fixes; this job fails when any per-file count rises, when a file absent from the baseline
  # starts erroring, and — deliberately — when a count falls without the reduction being committed
  # into docs/verification/typecheck-baseline.json in the same change. Reproduce locally with the
  # identical command: `bun run typecheck`.
  typecheck:
    # BLOCKING SIGNAL: on push/PR, growth or an uncommitted shrink of the Frozen Error Set blocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # --frozen-lockfile is what makes the compiler version a fact of the repository rather than
      # of the day the job happened to run: it covers graph-core, mcp-server and client alike.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # Node-LTS proof for @open-graph-mcp/client (INT-2 risk #2: Node vs Bun
  # runtime divergence). Runs in parallel with `test`, never replaces it —
  # this repo otherwise only promises Bun. Uses the real `node` binary from
  # actions/setup-node for every assertion below, not bun's node-compat shim.
  client-node:
    # BLOCKING SIGNAL: on push/PR, a Node-LTS build or client contract failure blocks.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node --version
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/client build
      - run: node --test packages/client/test/*.test.ts
      - run: node --test packages/client/test/dist-smoke.mjs

  # QA-2: mcp-web e2e (chromium headless) — real mcp-server subprocess + vite preview build, see
  # packages/mcp-web/e2e/fixture.ts. Blocking (no `if:`/continue-on-error), same as `test` — a broken
  # presence/toast/reconnect flow is exactly the class of regression unit tests can't see (the DOM/canvas
  # layer had zero coverage before this). setup-node alongside bun: Playwright's test runner forks real
  # Node worker processes for the actual test files regardless of what invoked the CLI.
  e2e:
    # BLOCKING SIGNAL: on push/PR, browser parity, presence, toast, or reconnect failure blocks.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/mcp-web
      - run: bun run test:parity
        working-directory: packages/mcp-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/mcp-web/test-results/
            packages/mcp-web/playwright-report/
          retention-days: 7

  # F002 task 15 — Coverage Baseline Ratchet Gate.
  #
  # BLOCKING STATUS IS DECLARED HERE, NOT INHERITED. `continue-on-error: false` is written out at
  # both the job and the step level even though false is the default: a reader deciding whether a
  # red mark here stops a merge must be able to answer from this file, and "it does not say" is not
  # an answer. Its event condition excludes only the manual probe-only dispatch; on push/PR no
  # branch or upstream result can make the gate advisory.
  #
  # Its own job, running in PARALLEL with `test`, rather than a step appended to `test`:
  # instrumentation costs +1501 ms / +1.85% on an ~82 s suite (task 14 measured it, it is recorded
  # in docs/verification/coverage-baseline.json under `timing`), but the RUN itself is a second full
  # suite. In a parallel job that second run costs wall-clock nothing on the existing critical path;
  # as a step inside `test` it would have added ~82 s to it. No existing job or step is reordered,
  # removed or made conditional by this addition.
  #
  # fetch-depth: 0 is load-bearing, not hygiene. The gate's second check reads the PREVIOUSLY
  # committed figure out of git at the merge-base with the base branch, which is how "lower the
  # coverage and re-measure" is caught — that trick produces a run agreeing with the file, so the
  # working-tree check alone would pass it. Actions' default shallow clone has no merge-base, and
  # the gate would then report the prior figure as unavailable. It says so out loud when that
  # happens rather than reporting a comparison it never made.
  #
  # There is no `--check`-style cheap mode here on purpose. A run that produces no figure exits 1
  # with outcome `unmeasured`: `measure-coverage.ts` refuses to write a figure from a red suite, so
  # a missing measurement means the suite failed — never that coverage is unchanged. If this job
  # goes red on a known flake, RE-RUN IT. Do not add `continue-on-error: true`; that converts a gate
  # that measures into a gate that reports.
  coverage:
    # BLOCKING SIGNAL: on push/PR, an unmeasured run or line/function coverage regression blocks.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Coverage Baseline Ratchet Gate (blocking)
        continue-on-error: false
        run: bun scripts/verification/coverage-gate.ts

  # F002 task 23 — one process executes the Suite Run and all six declared quality gates, captures
  # their real stdout/stderr/exit codes, and exclusively creates `.verification/run/<runId>.json`.
  # This duplicates expensive checks intentionally: cross-job status labels are not gate output and
  # cannot satisfy ADR-0021. The artifact step runs after red gates so a failed verdict is evidence too.
  suite-verdict:
    # BLOCKING SIGNAL: on push/PR, any failed blocking gate makes the published Suite Verdict fail.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Compose gates from runner output and publish append-only verdict
        run: bun scripts/verification/publish-verdict.ts
      - name: Upload immutable Suite Verdict evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: suite-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/run/
          retention-days: 30

  load:
    # ADVISORY SIGNAL: on PRs to main, presence-load failures report capacity evidence but never block.
    if: github.event_name != 'workflow_dispatch' && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:load
        working-directory: packages/mcp-server

  # F002 task 20 — performance/volume evidence runs only on explicit manual dispatch. The job is
  # advisory as a whole: timings and volumes are observations inside QA6/QA7, never merge gates.
  # Deterministic correctness remains blocking in `test`, because the same probe test files are part
  # of the root `bun run test` suite. Probe commands here are serial because the append-only ledger
  # deliberately has one writer and no cross-process append lock.
  eap-probes:
    # ADVISORY SIGNAL: probe failures and slow/large observations are uploaded but never block.
    if: github.event_name == 'workflow_dispatch' && inputs.run_eap_probes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      EAP_BENCHMARK_RECORD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Multi-process concurrency probe (advisory measurement)
        run: bun run probe:concurrency
        working-directory: packages/mcp-server
      - name: Cancellation fault injection probe (advisory execution)
        if: ${{ always() }}
        run: bun run probe:cancellation
        working-directory: packages/mcp-server
      - name: 100k-claim scale probe (advisory measurement)
        if: ${{ always() }}
        run: bun run probe:scale
        working-directory: packages/mcp-server
      - name: Materialize Benchmark Ledger delta
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p .verification/run
          git diff --binary -- docs/verification/benchmark-ledger.jsonl > .verification/run/benchmark-ledger.delta.patch
          cp docs/verification/benchmark-ledger.jsonl .verification/run/benchmark-ledger.jsonl
      - name: Upload advisory probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eap-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification/run/
          retention-days: 14
