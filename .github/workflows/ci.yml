name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      # NOTE (found during INT-2 T7): `bunx tsc` here resolves an unpinned TypeScript 7.0.2
      # (bunx's own fallback) rather than the 5.8.2 pinned via packages/client's devDependency,
      # since mcp-web has no local `typescript` devDependency of its own to resolve first. Still
      # passes clean today; not fixed here since it was tangential to T7's scope — worth pinning
      # a `typescript` devDependency here if this ever silently diverges.
      - run: bunx tsc --noEmit
        working-directory: packages/mcp-web
      - run: bun run build
        working-directory: packages/mcp-web

  # Node-LTS proof for @open-graph-mcp/client (INT-2 risk #2: Node vs Bun
  # runtime divergence). Runs in parallel with `test`, never replaces it —
  # this repo otherwise only promises Bun. Uses the real `node` binary from
  # actions/setup-node for every assertion below, not bun's node-compat shim.
  client-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node --version
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/client build
      - run: node --test packages/client/test/*.test.ts
      - run: node --test packages/client/test/dist-smoke.mjs

  # QA-2: mcp-web e2e (chromium headless) — real mcp-server subprocess + vite preview build, see
  # packages/mcp-web/e2e/fixture.ts. Blocking (no `if:`/continue-on-error), same as `test` — a broken
  # presence/toast/reconnect flow is exactly the class of regression unit tests can't see (the DOM/canvas
  # layer had zero coverage before this). setup-node alongside bun: Playwright's test runner forks real
  # Node worker processes for the actual test files regardless of what invoked the CLI.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/mcp-web
      - run: bunx playwright test --project=chromium
        working-directory: packages/mcp-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/mcp-web/test-results/
          retention-days: 7

  load:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:load
        working-directory: packages/mcp-server
